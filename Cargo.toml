[workspace]
members = [
    ".",
    "crates/yabane-extension-api",
    "extensions/request-defaults",
]
resolver = "2"

[package]
name = "yabane"
version = "0.1.0"
edition = "2024"
description = "A clear, reliable gateway to every LLM."
license = "MIT"

[features]
default = ["extension-request-defaults"]
extension-request-defaults = ["dep:yabane-extension-request-defaults"]

[dependencies]
argon2 = "0.5"
async-stream = "0.3"
base64 = "0.22"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
rand = "0.9"
password-hash = { version = "0.5", features = ["rand_core", "getrandom"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "socks", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
yabane-extension-api = { path = "crates/yabane-extension-api" }
yabane-extension-request-defaults = { path = "extensions/request-defaults", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
incremental = true
