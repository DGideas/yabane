[package]
name = "yabane-extension-traffic-capture"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros", "io-util"] }
yabane-extension-api = { path = "../../crates/yabane-extension-api" }
